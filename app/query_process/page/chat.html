<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>金融知识库</title>
  <style>
    :root{
      --bg:#eef2f9;
      --panel:#ffffff;
      --panel-2:#f7f9fd;
      --text:#0f1e35;
      --muted:#6b7a90;
      --brand:#3056d3;
      --brand2:#6c4bd8;
      --bubble-user:#3056d3;
      --bubble-bot:#ffffff;
      --border:#e4eaf3;
      --shadow-sm:0 1px 2px rgba(15,30,53,.05), 0 6px 18px rgba(15,30,53,.06);
      --shadow:0 28px 70px rgba(15,30,53,.16);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, "PingFang SC", Arial, sans-serif;
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      -webkit-font-smoothing:antialiased;
      background:
        radial-gradient(1100px 520px at 8% -10%, rgba(48,86,211,.16), transparent 60%),
        radial-gradient(900px 480px at 100% 0%, rgba(108,75,216,.14), transparent 55%),
        linear-gradient(180deg, #f4f7fc 0%, var(--bg) 55%, #e9eefa 100%);
    }
    .app{
      width:100%;
      max-width:1000px;
      height:min(860px, 94vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:14px;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, #ffffff, #fbfcff);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .logo{
      width:40px;height:40px;border-radius:12px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 10px 22px rgba(48,86,211,.28);
    }
    .logo svg{width:22px;height:22px;display:block}
    .title{
      display:flex;
      flex-direction:column;
      line-height:1.25;
      min-width:0;
    }
    .title strong{font-size:15px;font-weight:600;letter-spacing:.2px}
    .title span{
      font-size:12px;color:var(--muted);margin-top:3px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .top-actions{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .switch{
      display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
      font-size:12px;color:var(--muted);
      padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:#fff;
    }
    .switch input{accent-color:var(--brand);width:14px;height:14px;margin:0;cursor:pointer}
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 11px;
      border-radius:999px;
      background:#fff;
      white-space:nowrap;
    }
    .back-link{
      font-size:12px;
      color:var(--muted);
      text-decoration:none;
      padding:6px 11px;
      border:1px solid var(--border);
      border-radius:999px;
      background:#fff;
      white-space:nowrap;
      transition:color .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .back-link:hover{
      color:var(--brand);
      border-color:rgba(48,86,211,.4);
      box-shadow:0 6px 16px rgba(48,86,211,.12);
    }
    .btn{
      border:none;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;
      padding:8px 14px;
      border-radius:10px;
      font-size:12px;
      font-family:inherit;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 6px 16px rgba(48,86,211,.22);
      transition:filter .2s ease, transform .15s ease;
    }
    .btn:hover{filter:brightness(1.06)}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

    .chat{
      flex:1;
      overflow:auto;
      padding:20px 18px 14px;
      scroll-behavior:smooth;
      background:
        radial-gradient(700px 320px at 0% 0%, rgba(48,86,211,.05), transparent 60%),
        linear-gradient(180deg, #fbfcff, #ffffff 45%);
    }
    .chat::-webkit-scrollbar{width:10px}
    .chat::-webkit-scrollbar-track{background:transparent}
    .chat::-webkit-scrollbar-thumb{
      background:#d7dfec;border-radius:999px;
      border:3px solid transparent;background-clip:content-box;
    }
    .chat::-webkit-scrollbar-thumb:hover{background:#c3cee0;background-clip:content-box}
    .dayline{
      width:fit-content;
      margin:2px auto 18px;
      padding:4px 12px;
      font-size:12px;
      color:var(--muted);
      background:#f1f5fb;
      border-radius:999px;
    }
    .msg{
      display:flex;
      gap:12px;
      margin:16px 0;
      align-items:flex-end;
    }
    .msg.bot{align-items:flex-start}
    .msg.user{justify-content:flex-end}
    /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
    .msg > div:not(.avatar){
      flex:1;
      min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .avatar{
      flex:0 0 auto;
      height:28px;
      padding:0 11px;
      border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:600;letter-spacing:.3px;white-space:nowrap;
      color:#3d4a63;
      background:#eef2f8;
      border:1px solid var(--border);
      align-self:flex-start;
    }
    .avatar.bot{
      color:#2743a8;
      border-color:rgba(48,86,211,.18);
      background:linear-gradient(135deg, rgba(48,86,211,.12), rgba(108,75,216,.15));
    }
    .msg.user .avatar{align-self:flex-end}
    .bubble{
      max-width:min(760px, 80%);
      display:inline-block;
      border-radius:16px;
      padding:12px 15px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      position:relative;
      line-height:1.65;
      font-size:14px;
      color:var(--text);
      white-space:pre-wrap;
      overflow-wrap: break-word;
      box-shadow:var(--shadow-sm);
    }
    .msg.bot .bubble{border-top-left-radius:6px}
    .msg.user .bubble{
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;
      border-color:transparent;
      border-top-right-radius:6px;
      box-shadow:0 10px 24px rgba(48,86,211,.22);
    }
    .meta{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
      padding:0 2px;
    }
    details.progress{
      margin-top:10px;
      border:1px dashed rgba(107,122,144,.38);
      border-radius:12px;
      padding:9px 11px;
      background:linear-gradient(180deg, #f8fafd, #f4f7fc);
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      color:#54637a;
      font-size:12px;
      font-weight:500;
    }
    details.progress summary::marker{color:var(--brand)}
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12px;line-height:1.6;color:#54637a}

    /* 答案正文：脚本用 textContent 写入，保留换行 */
    .answer,
    .answer-text{
      white-space:pre-wrap;
      overflow-wrap:break-word;
    }

    .answer-images{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .answer-images img{
      display: block;
      max-width: min(100%, 600px);
      max-height: 600px;
      width: auto;
      height: auto;
      border-radius:12px;
      border:1px solid var(--border);
      box-shadow:var(--shadow-sm);
      background:#fff;
    }
    .answer-images a{
      font-size:12px;
      color:var(--muted);
      text-decoration:none;
      word-break:break-all;
    }
    .answer-images a:hover{color:var(--brand);text-decoration:underline}

    .typing{
      display:inline-flex;gap:6px;align-items:center;padding:2px 0;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:#a9b6c9;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.5}
      40%{transform:translateY(-5px);opacity:1}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:14px 18px 10px;
      display:flex;
      gap:12px;
      align-items:flex-end;
      background:linear-gradient(180deg, #ffffff, #fbfcff);
    }
    textarea{
      flex:1;
      resize:none;
      min-height:46px;
      max-height:150px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.55;
      font-family:inherit;
      color:var(--text);
      background:#fff;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    textarea::placeholder{color:#9aa8bd}
    textarea:focus{border-color:rgba(48,86,211,.55); box-shadow:0 0 0 4px rgba(48,86,211,.12)}
    .send{
      width:96px;
      height:46px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
      font-family:inherit;
      color:#fff;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 8px 20px rgba(48,86,211,.24);
      transition:filter .2s ease, transform .15s ease;
    }
    .send:hover{filter:brightness(1.06)}
    .send:active{transform:translateY(1px)}
    .send:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .hint{
      padding:0 18px 14px;
      color:var(--muted);
      font-size:12px;
      background:#fbfcff;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:#f4f7fc;
      color:#3d4a63;
      font-size:11px;
    }

    @media (max-width:720px){
      body{padding:0;height:100vh}
      .app{max-width:none;height:100vh;border-radius:0;border:none}
      .title span{display:none}
      .bubble{max-width:88%}
      .switch{padding:6px 9px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V9"/><path d="M10 19V4.5"/><path d="M16 19v-6.5"/><path d="M3 19h18"/>
          </svg>
        </div>
        <div class="title">
          <strong>金融知识库</strong>
          <span id="subTitle">在线 · 金融资料查询与风险提示（不构成投资建议）</span>
        </div>
      </div>
      <div class="top-actions">
        <a class="back-link" href="/">← 返回导航</a>
        <label class="switch">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">金融助手</div>
        <div>
          <div class="bubble">你好，我是金融知识库助手。你可以查询金融产品资料、金融知识、市场资讯、公司公告、风险提示和常见业务问题。<br><br>我会先给出结论，并附上风险提示与引用来源。<br><br><strong style="color:#b03a3f;">免责声明</strong>：本系统仅提供金融知识查询与资料解释，不提供投资建议、不承诺收益；正式信息请以产品合同、招募说明书、公告原文和监管文件为准。</div>
          <div class="meta">可以试着问：“什么是净值型理财？” / “华夏债券C 的风险等级是多少？” / “基金赎回多久到账？”</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <script>
    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:9091';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    // Session ID Logic
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      
      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      
      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      
      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);
      
      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">金融助手</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">掌柜智库</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✅ ${x}`),
        ...running.map(x => `⏳ ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open'); // 完成后自动收起
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        // 保留首条欢迎消息，其余先清空再渲染历史
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){
          // 轮询错误不立刻终止，让用户稍后重试
        }
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);
        
        // 渲染初始状态
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿到结果
          // data: { session_id, answer, done_list, error, message }
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { session_id } = data; // 此时 backend 返回 session_id
        
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        console.log('[perf] C EventSource created', performance.now(), { session_id });
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            // 当进度状态已完成时，提前结束“...”等待态
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              // 防止后端未发送 final 导致按钮一直禁用
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              // 即使后端未发送 final，也尽可能在流式过程中渲染图片
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            // 流式 delta 可能不包含“【图片】/图片列表”，最终包的 d.answer 才是完整答案；优先使用 d.answer
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
           // 响应用户的 final_answer 信号，确保图片渲染
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      // 清空除首条欢迎消息外的内容
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
